/* ══════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════ */
const emptyDB = () => ({ prefs: JSON.parse(JSON.stringify(DEFAULT_PREFS)), vault: '', extra: '', struct: null, jobs: {}, matches: {}, runs: [], sources: {}, lastCollect: null, aiCalls: {} });
// Your resume and facts can be built into this file (the <script id="seed"> tag), so a brand-new copy starts ready.

const listeners = new Set();
let saveTimer;

/* ══════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════ */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const lines = (s) => String(s || '').split(/\r?\n/).map(l => l.trim().toLowerCase()).filter(Boolean);

const decodeEntities = (s) => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
function htmlToText(html) {
  if (!html) return '';

/* ══════════════════════════════════════════════════════════════════
   NETWORK — the browser can't read career sites directly (CORS), so it
   tries the site first, then public readers, like Content Studio does.
   ══════════════════════════════════════════════════════════════════ */
const RUN = { ctl: new AbortController() };
const stopped = () => RUN.ctl.signal.aborted;
function stopEverything() { RUN.ctl.abort(); }

// Free public readers that let a web page read another site. Content Studio uses the same idea.

const ROUTES = {

  allorigins: (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  codetabs: (u) => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u),
  corsproxy: (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),

const routeMem = () => (DB.routes = DB.routes || {});

}

const parseLooseJSON = (t) => { try { return JSON.parse(t); } catch (e) {} if (/^\s*\[/.test(t)) return null; const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} } return null; };

      if (!r.ok) { lastErr = 'HTTP ' + r.status; continue; }

// Pulls a JSON array out of a page, e.g. "positions": [ ... ] embedded in HTML.

// Reads one job page: JSON-LD JobPosting first (most career sites include it), then the page text.
async function readJobPage(url, selectors = '') {

/* ══════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════ */
function titlePasses(title, inc, exc) {

  for (const k of inc) if (new RegExp('\\b' + esc(k)).test(t)) return true;
  return 'not a design role';
}

/* ══════════════════════════════════════════════════════════════════
   STUDIO ADAPTERS
   ══════════════════════════════════════════════════════════════════ */
const ADAPTERS = {

function paramountLoc(slug) {

function wdPosted(s) {

  return null;
}

/* ══════════════════════════════════════════════════════════════════
   GEMINI CONNECTION — the only two functions that talk to the AI.
   Note for Gemini: when this app runs inside Gemini, replace the BODY of askGemini()
   (and searchWebWithGemini()) with your built-in way of calling the model and Google Search.
   Keep the same inputs and return values; nothing else in the app needs to change.
   ══════════════════════════════════════════════════════════════════ */
let lastCall = 0; let goodModel = null; let everWorked = false;

// Input: { system, prompt, schema (optional JSON schema), temperature, tools (optional) }.  Returns the model's text.
async function askGemini({ system, prompt, schema, temperature = 0.3, tools }) {
  const key = (DB.prefs.api_key || '').trim();
  const models = goodModel ? [goodModel, ...MODELS.filter(m => m !== goodModel)] : MODELS;
  let lastErr = '', lastStatus = 0;
  for (const model of models) {
    let useSchema = !!schema && !tools;
    for (let attempt = 0; attempt < 3; attempt++) {
      const gap = 1200 - (Date.now() - lastCall); if (gap > 0) await sleep(gap);
      lastCall = Date.now();
      const gen = { temperature };
      if (!tools) gen.responseMimeType = 'application/json';
      if (useSchema) gen.responseSchema = schema;
      const body = { systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: prompt + (schema && !useSchema ? '\n\nAnswer with JSON only, in this shape:\n' + JSON.stringify(schemaExample(schema)) : '') }] }], generationConfig: gen };
      if (tools) body.tools = tools;
      let r, raw = '';
      try {
        r = await fetchTimeout(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
          { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, 60000);
        raw = await r.text();
      } catch (e) { if (e.name === 'StopError') throw e; lastErr = e.name === 'AbortError' ? 'Gemini took too long' : 'network problem'; continue; }
      lastStatus = r.status;
      if (r.status === 429 || r.status === 503 || r.status === 500) { lastErr = r.status === 429 ? 'Gemini is rate-limiting' : 'Gemini is busy'; await sleep(4000 * (attempt + 1)); continue; }
      if (r.status === 404) { lastErr = model + ' unavailable'; break; }
      if (r.status === 400 && useSchema) { useSchema = false; continue; }
      if (r.status === 401 || r.status === 403) { lastErr = 'Gemini refused the request (' + r.status + ')'; if (everWorked) { await sleep(3000); continue; } break; }
      if (!r.ok) { lastErr = 'Gemini ' + r.status + ': ' + raw.slice(0, 160); break; }
      let d = {}; try { d = JSON.parse(raw); } catch (e) {}
      const text = ((d.candidates || [])[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
      if (!text) { lastErr = 'empty answer'; continue; }
      goodModel = model; everWorked = true; DB.aiCalls[today()] = (DB.aiCalls[today()] || 0) + 1;
      return text;
    }
  }
  if ((lastStatus === 401 || lastStatus === 403) && !everWorked) throw new Error('Gemini needs a key here. Open this app inside Gemini, or add a key on the Search page.');
  throw new Error(lastErr || 'Gemini did not answer');
}

async function gemini(system, prompt, schema, temperature = 0.3) {
  const text = await askGemini({ system, prompt, schema, temperature });
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  try { return JSON.parse(a >= 0 ? text.slice(a, b + 1) : text); } catch (e) {}
  // one retry if the answer wasn't clean JSON
  const t2 = await askGemini({ system, prompt: prompt + '\n\nReturn valid JSON only.', schema, temperature });
  const a2 = t2.indexOf('{'), b2 = t2.lastIndexOf('}');
  return JSON.parse(a2 >= 0 ? t2.slice(a2, b2 + 1) : t2);
}
function schemaExample(s) {
  if (!s) return {};
  if (s.type === 'OBJECT') { const o = {}; for (const [k, v] of Object.entries(s.properties || {})) o[k] = schemaExample(v); return o; }
  if (s.type === 'ARRAY') return [schemaExample(s.items)];
  if (s.enum) return s.enum.join(' | ');
  return s.type === 'INTEGER' ? 0 : '…';
}

const S = { type: 'STRING' }, A = { type: 'ARRAY', items: { type: 'STRING' } }, FIT = { type: 'STRING', enum: ['Strong', 'Partial', 'Gap'] };

const SCORE_SYSTEM = `You are a demanding but fair hiring manager for design and product roles at top entertainment and tech companies (Apple, Netflix, Disney, Amazon, Warner Bros. Discovery, NBCUniversal, Paramount).
Compare ONE candidate's career vault with ONE job posting. Recruiters at these companies screen hard, so be realistic, not encouraging.

How to judge
1. core: first name the 2–3 things this job is really about: the kind of product, the domain, and the level. Rate the candidate on each: Strong only with direct experience of that exact thing in the vault; adjacent experience is Partial; missing is Gap.
2. Generic requirements anyone can claim ("strong communication", "problem solving", "attention to detail") barely move the score. Judge mostly on the core.
3. Years count by the kind of role asked for. Years in adjacent roles (internal tools, events, print, freelance) count as Partial, not Strong.

        const stopP = new Promise((_, rej) => RUN.ctl.signal.addEventListener('abort', () => rej(Object.assign(new Error('Stopped'), { name: 'StopError' }))));

          if (!old) fresh++;

        }

    .sort((a, b) => String(b.posted_at || b.first_seen).localeCompare(String(a.posted_at || a.first_seen)));

      <div className="bg-white rounded-3xl border border-line overflow-hidden"><div className="px-5 py-4 font-semibold">Studios and companies</div>
        <div className="divide-y divide-line">{Object.entries(STUDIOS).map(([k, l]) => { const s = db.sources[k] || {}; const bad = s.err && (!s.ok || s.err > s.ok); const n = Object.values(db.jobs).filter(j => j.source === k && j.active).length; return (
          <div key={k} className="px-5 py-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm"><span className={'w-2 h-2 rounded-full ' + (!db.prefs.sources[k] ? 'bg-stone-300' : bad ? 'bg-red-500' : s.ok ? 'bg-[#7fb321]' : 'bg-stone-300')} /><span className="font-medium w-48">{l}</span><span className="text-stone-600 w-40">{n} open design roles</span><span className="text-stone-500 text-xs flex-1 min-w-[200px]">{!db.prefs.sources[k] ? 'Turned off in Profile' : bad ? 'Last try failed: ' + s.error : s.ok ? 'OK · ' + ago(s.ok) + ' · ' + s.fresh + ' new' : 'Not checked yet'}</span></div>); })}</div></div>
      <div className="grid md:grid-cols-2 gap-4 mt-6">
        <Card title="AI" desc="Inside Gemini this uses Gemini itself, with no key and no credits. Outside Gemini, add a Google AI Studio key here.">
          <Field label="AI checks per search" hint="Each new job takes one AI check. Lower it if Gemini starts saying it's busy."><input type="number" min="1" max="60" className={inputCls + ' w-28'} value={db.prefs.checks_per_search} onChange={e => { DB.prefs.checks_per_search = +e.target.value || 15; commit(); }} /></Field>
          <div className="mt-3"><Field label="Gemini API key (only outside Gemini)"><input type="password" className={inputCls} value={db.prefs.api_key} onChange={e => { DB.prefs.api_key = e.target.value; commit(); }} placeholder="Leave empty inside Gemini" /></Field></div>
          <p className="text-xs text-stone-500 mt-3">{db.aiCalls[today()] || 0} AI calls today{goodModel ? ' · using ' + goodModel : ''}.</p>
        </Card>
        <Card title="Your data" desc="Everything lives in this browser. Download a backup to move it to another device or browser.">
          <div className="flex flex-wrap gap-2"><Btn onClick={backup}><Icon name="download" />Download backup</Btn><Btn onClick={() => importRef.current.click()}>Restore backup</Btn><input ref={importRef} type="file" accept=".json" className="hidden" onChange={e => e.target.files[0] && restore(e.target.files[0])} /></div>
          <p className="text-xs text-stone-500 mt-3">{Object.keys(db.jobs).length} jobs saved · {(JSON.stringify(db).length / 1e6).toFixed(1)} MB of about 5 MB</p>
        </Card>
      </div>
      {db.runs.length > 0 && <><h2 className="font-semibold mt-8 mb-3">Recent searches</h2><div className="space-y-2">{db.runs.slice(0, 8).map((r, i) => <details key={i} className="bg-white rounded-2xl border border-line"><summary className="px-5 py-3 cursor-pointer text-sm flex flex-wrap gap-x-4 list-none"><span className="font-medium">{new Date(r.at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span><span className="text-stone-600">{r.found} found · {r.new} new · {r.checked} checked{r.errors ? ' · ' + r.errors + ' studio errors' : ''}</span></summary><pre className="px-5 pb-4 text-[12px] text-stone-600 whitespace-pre-wrap">{r.log.join('\n')}</pre></details>)}</div></>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
